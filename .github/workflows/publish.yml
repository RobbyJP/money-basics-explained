name: Generate and publish content

on:
  schedule:
    # Twice a week: Mon and Thu at 09:00 UTC. Adjust as needed.
    - cron: "0 9 * * 1,4"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py --once --count 2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLIC_DIR: docs
          CNAME: ${{ vars.CNAME }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
